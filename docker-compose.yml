services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mechg-backend
    ports:
      - "8000:8000"
    environment:
      - GEMMA_API_KEY=${GEMMA_API_KEY:-}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemini-2.5-flash}
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - STRICT_SAFETY_GATE=true
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mechg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

